<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>외발 펭귄</title>
  <meta name="theme-color" content="#86c9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="외발펭귄" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" width="960" height="540"></canvas>

    <div id="mobile-controls" class="mobile-controls">
      <div id="mobile-rotation-pad" class="mobile-rotation-pad" role="group" aria-label="회전 입력">
        <div class="rotation-zone rotation-left">←</div>
        <div class="rotation-zone rotation-right">→</div>
      </div>
      <button id="mobile-jump-button" class="mobile-jump-button" type="button">JUMP</button>
    </div>

    <section id="start-screen" class="overlay visible">
      <div class="panel start-panel">
        <p class="version-label">v41</p>
        <h1>외발 펭귄</h1>
        <p class="subtitle">남극 빙판을 달리는 포고스틱 펭귄 러너</p>
        <p id="start-high-score" class="high-score-text">Best 0</p>
        <label class="mobile-toggle-row hard-mode-toggle-row start-toggle">
          <input id="hard-mode-toggle" type="checkbox" />
          Hard Mode
        </label>
        <button id="start-button" class="primary-button">게임 시작</button>
        <p class="shortcut-hint">또는 <strong>Space</strong> 키로 바로 시작</p>
      </div>
    </section>

    <section id="game-over-screen" class="overlay">
      <div class="panel small-panel">
        <p class="version-label">v41</p>
        <h1>Game Over</h1>
        <p id="final-score">Score: 0</p>
        <p id="game-over-message" class="game-over-message"></p>
        <p id="game-over-high-score" class="high-score-text">Best 0</p>
        <label class="mobile-toggle-row hard-mode-toggle-row game-over-toggle">
          <input id="game-over-hard-mode-toggle" type="checkbox" />
          Hard Mode
        </label>
        <button id="return-button" class="primary-button">다시 시작</button>
        <p class="shortcut-hint">또는 <strong>Space</strong> 키로 바로 재시작</p>
      </div>
    </section>
  </div>

  <script src="game.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
