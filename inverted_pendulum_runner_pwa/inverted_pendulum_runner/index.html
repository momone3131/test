<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pogo Penguin Runner</title>
  <meta name="theme-color" content="#0f2544" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PogoPenguin" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" width="960" height="540"></canvas>

    <div id="mobile-controls" class="mobile-controls">
      <div class="mobile-slider-wrap">
        <span class="mobile-label">회전</span>
        <input id="mobile-rotation-slider" class="mobile-slider" type="range" min="-100" max="100" value="0" step="1" />
      </div>
      <button id="mobile-jump-button" class="mobile-jump-button" type="button">JUMP</button>
    </div>

    <section id="start-screen" class="overlay visible">
      <div class="panel start-panel">
        <h1>Inverted Pendulum Runner</h1>
        <p class="subtitle">남극 빙판을 달리는 포고스틱 펭귄 러너</p>
        <p id="start-high-score" class="high-score-text">Best 0</p>
        <label class="mobile-toggle-row start-toggle">
          <input id="mobile-mode-toggle" type="checkbox" />
          모바일 터치 조작 사용
        </label>
        <button id="start-button" class="primary-button">게임 시작</button>
        <p class="shortcut-hint">또는 <strong>Space</strong> 키로 바로 시작</p>
      </div>
    </section>

    <section id="game-over-screen" class="overlay">
      <div class="panel small-panel">
        <h1>Game Over</h1>
        <p id="final-score">Score: 0</p>
        <p id="game-over-high-score" class="high-score-text">Best 0</p>
        <button id="return-button" class="primary-button">시작화면으로</button>
        <p class="shortcut-hint">또는 <strong>Space</strong> 키로 시작화면 복귀</p>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
